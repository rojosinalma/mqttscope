name: Feature request
description: Propose a change or an addition
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that mqttscope does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? A settings key, an API endpoint, a view, a chart type…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Explorer / topic tree
        - History and search
        - Diffs and charts
        - Device presence
        - Broker statistics
        - Publishing
        - Settings
        - API / SSE
        - Docker / deployment
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I searched existing issues.
